<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="robots" content="noindex,nofollow">
<title>Checkout — Xpertone Creative</title>
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/main.css?v=20260914sku" rel="stylesheet">
<meta property="og:title" content="Checkout — Xpertone Creative">
<meta property="og:image" content="https://www.xpertonecreative.com/assets/img/brand/og-xpertone.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Checkout — Xpertone Creative">
<meta name="twitter:image" content="https://www.xpertonecreative.com/assets/img/brand/og-xpertone.png">
</head>
<body data-page="cart">
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main" class="container py-5">

  <div class="steps">
    <span class="step is-done"><span class="step__n"><i class="fa-solid fa-check"></i></span> Your order</span>
    <span class="step__sep"></span>
    <span class="step is-active"><span class="step__n">2</span> Details &amp; delivery</span>
    <span class="step__sep"></span>
    <span class="step"><span class="step__n">3</span> Confirm</span>
  </div>

  <div id="checkoutBody"></div>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js?v=20260917artwork"></script>
<script src="assets/js/store.js?v=20260914sku"></script>
<script src="assets/js/ui.js?v=20260914sku"></script>
<script src="assets/js/wheel.js?v=20260918"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  var body = XO.el('#checkoutBody');
  var gift = window.Giveaway ? Giveaway.claim() : null;

  if (!Cart.lines().length && !gift) {
    body.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state__icon"><i class="fa-solid fa-receipt"></i></div>' +
      '<h2>Nothing to check out yet</h2>' +
      '<p class="text-muted-xo">Your order is empty — add a few products and come back.</p>' +
      '<a class="btn btn-xo" href="/">Browse products</a></div>';
    return;
  }

  if (gift && Cart.totals().subtotal < XO_CONFIG.GIVEAWAY_MIN_SPEND) {
    body.innerHTML = '<div class="empty-state"><div class="empty-state__icon"><i class="fa-solid fa-gift"></i></div>' +
      '<h2>Add a few products to redeem your gift</h2><p class="text-muted-xo">Your ' + XO.esc(gift.prize.label) +
      ' is reserved. Giveaway checkout needs at least ' + XO.money(XO_CONFIG.GIVEAWAY_MIN_SPEND) +
      ' in paid products, plus AED 30 delivery.</p><a class="btn btn-xo" href="/">Add products</a></div>';
    return;
  }

  function hasArtworkProducts() {
    return Cart.lines().some(function (line) {
      return ['safety-vests', 'uniforms'].indexOf(line.category) !== -1;
    });
  }

  function artworkSubmission() {
    if (!hasArtworkProducts()) return '';
    return '<h2 class="h5 mt-4 mb-3">Artwork for printing</h2>' +
      '<div class="p-3 p-lg-4 border rounded-3" style="background:var(--xo-surface-alt)">' +
        '<p class="mb-3" style="font-size:.93rem"><b style="color:var(--xo-ink)">' +
          'Optional for Safety Vests and Workwear.</b> Upload your company logo or finished artwork. ' +
          'We will check it and send a proof before production.</p>' +
        '<div class="row g-3">' +
          '<div class="col-12"><label class="form-label" for="f_artwork">Logo / artwork file</label>' +
            '<input class="form-control" id="f_artwork" name="artwork" type="file" ' +
              'accept="' + XO.esc(XO_CONFIG.PRINTING.accept) + '">' +
            '<div class="form-text">PDF, AI, EPS, SVG, PNG, JPG, WEBP or ZIP. Maximum ' +
              XO_CONFIG.PRINTING.maxFileMB + ' MB.</div></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_placement">Preferred placement</label>' +
            '<select class="form-select" id="f_placement" name="artwork_placement">' +
              XO_CONFIG.PRINTING.placements.map(function (placement) {
                return '<option>' + XO.esc(placement) + '</option>';
              }).join('') +
            '</select></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_print_text">Text to print <span class="text-muted-xo">(optional)</span></label>' +
            '<input class="form-control" id="f_print_text" name="print_text" ' +
              'placeholder="Company name, role or department"></div>' +
          '<div class="col-12"><label class="form-label" for="f_artwork_notes">Artwork instructions <span class="text-muted-xo">(optional)</span></label>' +
            '<textarea class="form-control" id="f_artwork_notes" name="artwork_notes" rows="2" ' +
              'placeholder="Colours, dimensions, products to print, or any special instruction"></textarea></div>' +
        '</div>' +
      '</div>';
  }

  var t = Cart.totals();

  body.innerHTML =
    '<h1 class="mb-4">Checkout</h1>' +
    '<form id="coForm" novalidate><div class="row g-4 g-lg-5">' +

      '<div class="col-lg-7">' +

        '<h2 class="h5 mb-3">Who is ordering</h2>' +
        '<div class="row g-3">' +
          '<div class="col-md-6"><label class="form-label" for="f_company">Company name *</label>' +
            '<input class="form-control" id="f_company" name="company" required autocomplete="organization"></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_name">Contact person *</label>' +
            '<input class="form-control" id="f_name" name="name" required autocomplete="name"></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_phone">Mobile / WhatsApp *</label>' +
            '<input class="form-control" id="f_phone" name="phone" required inputmode="tel" ' +
            'autocomplete="tel" placeholder="05X XXX XXXX"></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_email">Email *</label>' +
            '<input class="form-control" id="f_email" name="email" type="email" required autocomplete="email"></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_trn">TRN <span class="text-muted-xo">(optional)</span></label>' +
            '<input class="form-control" id="f_trn" name="trn" placeholder="For your tax invoice"></div>' +
        '</div>' +

        '<h2 class="h5 mt-4 mb-3">Where it is going</h2>' +
        '<div class="row g-3">' +
          '<div class="col-md-6"><label class="form-label" for="f_emirate">Emirate *</label>' +
            '<select class="form-select" id="f_emirate" name="emirate" required>' +
              '<option value="">Choose…</option>' +
              ['Dubai','Abu Dhabi','Sharjah','Ajman','Ras Al Khaimah','Fujairah','Umm Al Quwain']
                .map(function (e) { return '<option>' + e + '</option>'; }).join('') +
            '</select></div>' +
          '<div class="col-md-6"><label class="form-label" for="f_area">Area / district</label>' +
            '<input class="form-control" id="f_area" name="area" placeholder="e.g. Al Quoz, JAFZA"></div>' +
          '<div class="col-12"><label class="form-label" for="f_address">Delivery address *</label>' +
            '<textarea class="form-control" id="f_address" name="address" rows="2" required ' +
            'placeholder="Building, street, site name, any gate or access instructions"></textarea></div>' +
        '</div>' +

        artworkSubmission() +

        '<h2 class="h5 mt-4 mb-3">How you would like to pay</h2>' +
        '<label class="pay-option is-selected" data-pay>' +
          '<input class="form-check-input mt-1" type="radio" name="payment" value="Bank transfer" checked>' +
          '<span><b>Bank transfer</b><span>We issue a proforma invoice, you transfer, we ship on clearance.</span></span></label>' +
        '<label class="pay-option" data-pay>' +
          '<input class="form-check-input mt-1" type="radio" name="payment" value="Cash on delivery">' +
          '<span><b>Cash on delivery</b><span>Pay the driver on handover. Available across the UAE.</span></span></label>' +
        '<label class="pay-option" data-pay>' +
          '<input class="form-check-input mt-1" type="radio" name="payment" value="Card on collection">' +
          '<span><b>Card on collection</b><span>Pay by card when collecting from our Al Quoz warehouse.</span></span></label>' +

        '<div class="mt-4"><label class="form-label" for="f_notes">Anything else we should know</label>' +
          '<textarea class="form-control" id="f_notes" name="notes" rows="2" ' +
          'placeholder="Deadline, site contact, PO number…"></textarea></div>' +

      '</div>' +

      '<div class="col-lg-5">' +
        '<div class="summary-card">' +
          '<h2 class="h5 mb-3">Order summary</h2>' +
          (gift ? '<div class="d-flex gap-2 justify-content-between py-2" style="border-bottom:1px solid var(--xo-line);color:#654d00">' +
            '<div style="font-size:.88rem"><b><i class="fa-solid fa-gift"></i> FREE: ' + XO.esc(gift.prize.label) + '</b>' +
            '<div>' + XO.esc(Giveaway.sizeText(gift)) + '</div></div><b class="num">AED 0</b></div>' : '') +
          '<div style="max-height:280px;overflow:auto;margin:-.25rem -.25rem .5rem;padding:.25rem">' +
            Cart.lines().map(function (l) {
              var q = Cart.lineQty(l);
              return '<div class="d-flex gap-2 justify-content-between py-2" style="border-bottom:1px solid var(--xo-line)">' +
                '<div style="font-size:.88rem"><b style="color:var(--xo-ink)">' + XO.esc(l.title) + '</b>' +
                '<div class="text-muted-xo">' + q + ' pcs · ' +
                Object.keys(l.qty).map(function (s) { return s + ' x' + l.qty[s]; }).join(', ') + '</div></div>' +
                '<div class="num" style="white-space:nowrap;font-weight:700;color:var(--xo-ink)">' +
                XO.money(Pricing.lineTotal(l.price, q)) + '</div></div>';
            }).join('') +
          '</div>' +
          '<div class="summary-card__row"><span>Subtotal (ex VAT)</span><b class="num">' + XO.money(t.subtotal) + '</b></div>' +
          (t.savings > 0 ? '<div class="summary-card__row"><span style="color:var(--xo-success)">Volume discount</span>' +
            '<b class="num" style="color:var(--xo-success)">-' + XO.money(t.savings) + '</b></div>' : '') +
          '<div class="summary-card__row"><span>Delivery</span><b class="num">' +
            (t.delivery ? XO.money(t.delivery) : 'Free') + '</b></div>' +
          '<div class="summary-card__row"><span>VAT (5%)</span><b class="num">' + XO.money(t.vat) + '</b></div>' +
          '<div class="summary-card__row summary-card__total"><span>Total</span><b class="num">' + XO.money(t.total) + '</b></div>' +

          (Cart.lines().some(function (l) { return XO.indicative(l); })
            ? '<p class="price-note mt-3 mb-0"><i class="fa-solid fa-circle-info"></i> ' +
              'This total is indicative. Sending this asks us for a written quotation — ' +
              'nothing is charged and nothing is produced until you approve it.</p>' : '') +

          '<button class="btn btn-xo btn-lg-xo w-100 mt-3" type="submit" id="placeBtn">' +
            '<i class="fa-solid fa-paper-plane"></i> Place order</button>' +
          '<button class="btn btn-wa w-100 mt-2" type="button" id="waSend">' +
            '<i class="fa-brands fa-whatsapp"></i> Send on WhatsApp instead</button>' +
          '<a class="btn btn-link w-100 mt-2" href="cart.html" ' +
            'style="color:var(--xo-muted);text-decoration:none;font-size:.88rem">Back to your order</a>' +
          '<p class="form-text text-center mt-3 mb-0">' +
            'Placing an order does not charge you. We confirm stock, printing and the final invoice first.</p>' +
        '</div>' +
      '</div>' +

    '</div></form>';

  XO.els('[data-pay]').forEach(function (opt) {
    opt.addEventListener('click', function () {
      XO.els('[data-pay]').forEach(function (o) { o.classList.remove('is-selected'); });
      opt.classList.add('is-selected');
    });
  });

  function collect() {
    var f = XO.el('#coForm');
    var d = new FormData(f);
    var artworkInput = XO.el('#f_artwork');
    var artworkFile = artworkInput && artworkInput.files ? artworkInput.files[0] : null;
    return {
      company: d.get('company') || '',
      name: d.get('name') || '',
      phone: d.get('phone') || '',
      email: d.get('email') || '',
      trn: d.get('trn') || '',
      emirate: d.get('emirate') || '',
      area: d.get('area') || '',
      address: d.get('address') || '',
      logo: !!artworkFile,
      artworkFile: artworkFile,
      artworkFileName: artworkFile ? artworkFile.name : '',
      artworkPlacement: d.get('artwork_placement') || '',
      printText: d.get('print_text') || '',
      artworkNotes: d.get('artwork_notes') || '',
      payment: d.get('payment') || '',
      notes: d.get('notes') || ''
    };
  }

  function printingSummary(customer) {
    if (!hasArtworkProducts()) return 'Not applicable to the ordered products';
    if (!customer || !customer.logo) return 'No artwork submitted';
    return [
      'Artwork file: ' + customer.artworkFileName,
      'Preferred placement: ' + (customer.artworkPlacement || 'Not specified'),
      'Text to print: ' + (customer.printText || 'None'),
      'Instructions: ' + (customer.artworkNotes || 'None')
    ].join('\n');
  }

  /* WhatsApp copy of the order, with the printing details appended. */
  function orderMessage(c) {
    var m = Cart.asMessage(c);
    if (hasArtworkProducts()) m += '\n\nArtwork for printing:\n' + printingSummary(c);
    return m;
  }

  /* FormSubmit renders each property as one email-table row. Keep every
     product, size split and price in its own named row so orders remain easy
     to scan on desktop and mobile instead of hiding everything in one long
     "Full order" cell. */
  function sizeBreakdown(line) {
    var sizes = Object.keys(line.qty || {}).sort(function (a, b) {
      var ai = XO_CONFIG.SIZE_ORDER.indexOf(a);
      var bi = XO_CONFIG.SIZE_ORDER.indexOf(b);
      if (ai < 0) ai = 999;
      if (bi < 0) bi = 999;
      return ai === bi ? a.localeCompare(b) : ai - bi;
    });
    return sizes.map(function (size) {
      return size + ': ' + line.qty[size] + ' pcs';
    }).join('  |  ') || 'One size: ' + Cart.lineQty(line) + ' pcs';
  }

  function emailOrderFields(customer, lines, totals) {
    var indicative = lines.some(function (line) { return XO.indicative(line); });
    var fields = {
      _subject: XO_CONFIG.EMAIL.orderSubject + ' — ' +
        (customer.company || customer.name || 'website') + ' — ' +
        totals.units + ' pcs — ' + XO.money(totals.total),
      _template: 'table',
      _replyto: customer.email,

      'ORDER STATUS': indicative
        ? 'INDICATIVE PRICING — prepare and confirm a manual quotation'
        : 'CATALOGUE PRICING — confirm stock and issue the invoice',
      'CUSTOMER / COMPANY': customer.company || '—',
      'CONTACT PERSON': customer.name || '—',
      'PHONE': customer.phone || '—',
      'EMAIL': customer.email || '—',
      'TRN': customer.trn || '—',
      'DELIVERY LOCATION': [customer.area, customer.emirate].filter(Boolean).join(', ') || '—',
      'FULL ADDRESS': customer.address || '—',
      'PAYMENT METHOD': customer.payment || '—',
      'CUSTOMER NOTES': customer.notes || '—'
    };

    if (gift) {
      fields['FREE WHEEL PRIZE'] = gift.prize.label + ' (' + gift.prize.sku + ')';
      fields['GIFT SIZE SPLIT'] = Giveaway.sizeText(gift);
      fields['GIVEAWAY LEAD PHONE'] = gift.phone;
      fields['GIVEAWAY LEAD EMAIL'] = gift.email;
    }

    lines.forEach(function (line, index) {
      var number = String(index + 1).padStart(2, '0');
      var qty = Cart.lineQty(line);
      var sku = line.id || 'No SKU';
      fields['ITEM ' + number + ' — SKU ' + sku] = line.title;
      fields['ITEM ' + number + ' — SIZES / QUANTITIES'] = sizeBreakdown(line);
      fields['ITEM ' + number + ' — PRICE'] =
        qty + ' pcs × ' + XO.money(Pricing.unitPrice(line.price, qty)) +
        ' each = ' + XO.money(Pricing.lineTotal(line.price, qty));
      fields['ITEM ' + number + ' — LOGO PRINTING'] =
        customer.logo && ['safety-vests', 'uniforms'].indexOf(line.category) !== -1
          ? 'YES — use the attached order artwork' : 'NO';
      if (line.note) fields['ITEM ' + number + ' — NOTE'] = line.note;
    });

    fields['PRINTING / ARTWORK BRIEF'] = printingSummary(customer);
    fields['TOTAL PRODUCT LINES'] = lines.length;
    fields['TOTAL PIECES'] = totals.units;
    fields['SUBTOTAL — EX VAT'] = XO.money(totals.subtotal);
    fields['VOLUME DISCOUNT'] = totals.savings > 0 ? '-' + XO.money(totals.savings) : 'None';
    fields['DELIVERY'] = totals.delivery ? XO.money(totals.delivery) : 'Free';
    fields['VAT — 5%'] = XO.money(totals.vat);
    fields['GRAND TOTAL — INCL VAT'] = XO.money(totals.total);
    return fields;
  }

  function validate() {
    var f = XO.el('#coForm');
    var ok = true;
    XO.els('[required]', f).forEach(function (el) {
      var bad = !el.value.trim() || (el.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
      el.classList.toggle('is-invalid', bad);
      if (bad && ok) { el.focus(); ok = false; }
    });
    var artwork = XO.el('#f_artwork');
    if (artwork && artwork.files && artwork.files[0] &&
        artwork.files[0].size > XO_CONFIG.PRINTING.maxFileMB * 1024 * 1024) {
      artwork.classList.add('is-invalid');
      XO.toast('Artwork must be ' + XO_CONFIG.PRINTING.maxFileMB + ' MB or smaller', 'fa-triangle-exclamation');
      artwork.focus();
      ok = false;
    }
    if (!ok) XO.toast('Please complete the highlighted fields', 'fa-triangle-exclamation');
    return ok;
  }

  XO.el('#waSend').addEventListener('click', function () {
    window.open(XO.waLink(orderMessage(collect())), '_blank', 'noopener');
  });

  XO.el('#coForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validate()) return;

    var customer = collect();
    var payload = Cart.asPayload(customer);
    var btn = XO.el('#placeBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending…';

    function done(reference) {
      try {
        sessionStorage.setItem('xo_last_order', JSON.stringify({
          reference: reference || '',
          customer: customer,
          payload: payload,
          message: orderMessage(customer)
        }));
      } catch (err) {}
      Cart.clear();
      if (gift) localStorage.removeItem(Giveaway.key);
      window.location.href = gift ? '/' : 'order-confirmation.html';
    }

    var mode = XO_CONFIG.ORDER_MODE;

    function failToWhatsApp(err) {
      console.error('[Xpertone Creative LLC-FZ] Order submission failed', err);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Place order';
      XO.toast('Could not send it — use the WhatsApp button instead', 'fa-triangle-exclamation');
    }

    /* ---- Email the order. Totals are read before done() clears the cart. ---- */
    if (mode === 'email') {
      var E = XO_CONFIG.EMAIL;
      var t2 = Cart.totals();
      var linesAtOrder = Cart.lines();

      var fields = emailOrderFields(customer, linesAtOrder, t2);

      /* Artwork is attached directly for eligible Safety Vest and Workwear
         orders. Multipart submission is only used when a customer supplied a
         file; ordinary orders continue through the faster background request. */
      if (customer.artworkFile) {
        try {
          sessionStorage.setItem('xo_last_order', JSON.stringify({
            reference: '', customer: customer, payload: payload,
            message: orderMessage(customer)
          }));
        } catch (err) {}

        var relay = document.createElement('form');
        relay.method = 'POST';
        relay.action = E.uploadEndpoint;
        relay.enctype = 'multipart/form-data';
        relay.style.display = 'none';

        Object.keys(fields).forEach(function (k) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = k;
          input.value = fields[k];
          relay.appendChild(input);
        });

        var next = document.createElement('input');
        next.type = 'hidden';
        next.name = '_next';
        next.value = gift ? location.origin + '/' : location.href.replace(/[^/]*$/, '') + 'order-confirmation.html';
        relay.appendChild(next);

        var noCaptcha = document.createElement('input');
        noCaptcha.type = 'hidden';
        noCaptcha.name = '_captcha';
        noCaptcha.value = 'false';
        relay.appendChild(noCaptcha);

        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.name = 'attachment';
        var dt = new DataTransfer();
        dt.items.add(customer.artworkFile);
        fileInput.files = dt.files;
        relay.appendChild(fileInput);

        document.body.appendChild(relay);
        Cart.clear();
        if (gift) localStorage.removeItem(Giveaway.key);
        relay.submit();
        return;
      }

      fetch(E.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(fields)
      })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function () { done(''); })
        .catch(failToWhatsApp);
      return;
    }

    /* ---- WhatsApp handoff. ---- */
    if (mode === 'whatsapp') {
      window.open(XO.waLink(orderMessage(customer)), '_blank', 'noopener');
      done('');
      return;
    }

    fetch(XO_CONFIG.API_BASE + XO_CONFIG.ENDPOINTS.createOrder, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (res) {
        if (mode === 'both') window.open(XO.waLink(orderMessage(customer)), '_blank', 'noopener');
        done(res.reference || res.order_reference || '');
      })
      .catch(failToWhatsApp);
  });

});
</script>
  <script src="assets/js/crm-hook.js?v=20260914sku"></script>
</body>
</html>
