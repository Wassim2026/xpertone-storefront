<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — XpertOne Prints</title>
<meta name="description" content="Product details, sizes and bulk pricing. Add your own logo and text, see it on the product, then order online.">
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-page="shop">
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main">
  <div class="container py-4" id="pdp">
    <div class="row g-4">
      <div class="col-lg-6"><div class="skeleton" style="aspect-ratio:1/1;border-radius:16px"></div></div>
      <div class="col-lg-6">
        <div class="skeleton mb-3" style="height:22px;width:35%"></div>
        <div class="skeleton mb-3" style="height:38px;width:80%"></div>
        <div class="skeleton mb-3" style="height:120px"></div>
        <div class="skeleton" style="height:220px"></div>
      </div>
    </div>
  </div>

  <section class="section section--alt" id="relatedWrap" hidden>
    <div class="container">
      <div class="section-head mb-4">
        <span class="eyebrow">Same range</span>
        <h2 class="mt-2 mb-0">You may also need</h2>
      </div>
      <div class="row g-4" id="related"></div>
    </div>
  </section>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/designer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  var uid = XO.qs('p');
  var mount = XO.el('#pdp');

  if (!uid) { notFound(); return; }

  function notFound() {
    mount.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state__icon"><i class="fa-solid fa-magnifying-glass"></i></div>' +
      '<h2>Product not found</h2>' +
      '<p class="text-muted-xo">That link may be out of date. Browse the full catalogue instead.</p>' +
      '<a class="btn btn-xo" href="shop.html">View all products</a></div>';
  }

  Catalog.byUid(uid).then(function (p) {
    if (!p) { notFound(); return; }
    render(p);
    related(p);
  }).catch(notFound);

  function tierTable() {
    var tiers = XO_CONFIG.PRICE_TIERS || [];
    if (!tiers.length) return '';
    return '<table class="tier-table mt-3"><thead><tr><th>Quantity</th><th>Discount</th></tr></thead><tbody>' +
      tiers.map(function (t) {
        return '<tr data-min="' + t.min + '"><td>' + t.min + '+ pieces</td><td>' +
          Math.round(t.discount * 100) + '% off</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* The catalogue carries the manufacturer's own bullet points. Show them
     under the buy box rather than flattening them into one paragraph. */
  function featureList(p) {
    var f = (p.features || []).slice(1);   /* the first one is the description */
    if (!f.length) return '';
    return '<div class="mt-4"><h2 class="h6 mb-2">Specification</h2><ul class="feature-list">' +
      f.map(function (x) { return '<li>' + XO.esc(x) + '</li>'; }).join('') +
      '</ul></div>';
  }

  function specRows(p) {
    var rows = [
      ['Product code', p.code],
      ['Material', p.material],
      ['Colours', p.colour],
      ['Dimensions', p.dimensions],
      ['Fabric weight', p.gsm],
      ['Standard', p.standard],
      ['Packing', p.packing],
      ['Country of origin', p.origin]
    ];
    return rows.filter(function (r) { return r[1]; }).map(function (r) {
      return '<li><b>' + r[0] + '</b><span>' + XO.esc(r[1]) + '</span></li>';
    }).join('');
  }

  function render(p) {
    document.title = p.title + ' — XpertOne Prints';
    var meta = document.querySelector('meta[name=description]');
    if (meta && p.description) meta.setAttribute('content', p.description.slice(0, 160));
    var canonical = document.querySelector('link[rel=canonical]') || document.createElement('link');
    canonical.setAttribute('rel', 'canonical');
    canonical.setAttribute('href', 'https://www.xpertonecreative.com/product.html?p=' + encodeURIComponent(p.uid));
    if (!canonical.parentNode) document.head.appendChild(canonical);
    var schema = document.createElement('script');
    schema.type = 'application/ld+json';
    schema.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'Product', name: p.title,
      description: p.description || p.subtitle || p.title, sku: p.code || p.uid,
      image: p.images || [], brand: { '@type': 'Brand', name: 'XpertOne Prints' },
      offers: { '@type': 'Offer', priceCurrency: 'AED', price: p.price,
        availability: 'https://schema.org/InStock',
        url: canonical.getAttribute('href') }
    });
    document.head.appendChild(schema);

    var ind = XO.indicative(p);
    var img = p.images[0];
    var desc = p.description ||
      'Supplied in bulk from our Al Quoz warehouse, with optional front and back logo printing. ' +
      'Contact us for artwork proofing and production lead times on large orders.';

    mount.innerHTML =
      '<nav aria-label="Breadcrumb" class="mb-3" style="font-size:.85rem">' +
        '<a href="index.html" class="text-muted-xo">Home</a><span class="text-muted-xo mx-1">/</span>' +
        '<a href="shop.html?category=' + p.category + '" class="text-muted-xo">' + XO.esc(p.categoryName) + '</a>' +
        '<span class="text-muted-xo mx-1">/</span><span style="color:var(--xo-ink);font-weight:600">' + XO.esc(p.title) + '</span>' +
      '</nav>' +

      '<div class="row g-4 g-lg-5">' +

        '<div class="col-lg-6">' +
          '<div class="gallery__main">' +
            (img ? '<img src="' + XO.esc(img) + '" alt="' + XO.esc(p.title) + '" id="mainImg">'
                 : '<i class="fa-solid fa-image fa-3x text-muted-xo"></i>') +
          '</div>' +
          '<div class="mt-4 p-4 border rounded-3" style="background:var(--xo-surface-alt)">' +
            '<h3 class="h6 mb-3"><i class="fa-solid fa-pen-ruler" style="color:var(--xo-amber-600)"></i> Logo printing</h3>' +
            '<p class="mb-0" style="font-size:.92rem">' + XO.esc(XO_CONFIG.LOGO_PRINTING.note) + ' ' +
            'Upload your logo below and we remove the background for you — then you see it on the product before you order.</p>' +
          '</div>' +
        '</div>' +

        '<div class="col-lg-6">' +
          '<span class="product-card__cat">' + XO.esc(p.categoryName) + '</span>' +
          '<h1 class="mt-1" style="font-size:clamp(1.5rem,1.1rem+1.4vw,2.1rem)">' + XO.esc(p.title) + '</h1>' +
          (p.subtitle ? '<p class="text-muted-xo mb-2">' + XO.esc(p.subtitle) + '</p>' : '') +

          '<div class="d-flex align-items-baseline gap-2 mt-3">' +
            '<span class="num" style="font-size:2rem;font-weight:800;color:var(--xo-ink);letter-spacing:-.03em">' +
              XO.money(p.price) + '</span>' +
            '<span class="text-muted-xo">per piece · ex VAT</span>' +
          '</div>' +
          (ind ? '<p class="price-note mt-2 mb-0"><i class="fa-solid fa-circle-info"></i> ' +
                 XO.esc(XO_CONFIG.INDICATIVE.long) + '</p>' : '') +
          '<div class="d-flex flex-wrap gap-2 mt-2">' +
            '<span class="badge-xo badge-xo--green"><i class="fa-solid fa-circle-check"></i> In stock</span>' +
            (p.attribute ? '<span class="badge-xo badge-xo--amber">' + XO.esc(p.attribute) + '</span>' : '') +
            '<span class="badge-xo badge-xo--ink">MOQ ' + XO_CONFIG.MOQ + ' pcs</span>' +
          '</div>' +

          '<p class="mt-3">' + XO.esc(desc) + '</p>' +

          tierTable() +

          '<div class="mt-4" id="qtyMount"></div>' +

          '<div class="mt-4" id="designMount"></div>' +

          '<div class="d-flex flex-wrap gap-2 mt-3">' +
            '<button class="btn btn-xo btn-lg-xo flex-grow-1" id="addBtn" type="button">' +
              '<i class="fa-solid fa-cart-plus"></i> Add to cart</button>' +
            '<button class="btn btn-wa btn-lg-xo" id="waBtn" type="button">' +
              '<i class="fa-brands fa-whatsapp"></i> Order on WhatsApp</button>' +
          '</div>' +

          featureList(p) +

          '<ul class="spec-list mt-4">' +
            specRows(p) +
            '<li><b>Available sizes</b><span>' + (p.sizes.length ? XO.esc(p.sizes.join(', ')) : 'One size') + '</span></li>' +
            '<li><b>Minimum order</b><span>' + XO_CONFIG.MOQ + ' pieces per product</span></li>' +
            '<li><b>Logo printing</b><span>Upload your artwork above and see it on the product</span></li>' +
            '<li><b>Delivery</b><span>2–3 working days in Dubai · 3–5 days elsewhere in the UAE</span></li>' +
            '<li><b>VAT</b><span>Prices exclude 5% VAT · TRN tax invoice provided</span></li>' +
            '<li><b>Payment</b><span>Bank transfer, cash on delivery, or card on collection</span></li>' +
          '</ul>' +
        '</div>' +
      '</div>';

    var matrix = QtyMatrix({
      mount: '#qtyMount',
      product: p,
      onChange: function (s) {
        XO.el('#addBtn').disabled = !s.valid;
        XO.els('.tier-table tr[data-min]').forEach(function (tr) {
          tr.classList.toggle('is-active', s.units >= parseInt(tr.getAttribute('data-min'), 10));
        });
      }
    });

    var designer = ProductDesigner({ mount: '#designMount', product: p });

    XO.el('#addBtn').addEventListener('click', function () {
      if (designer && designer.isBusy()) {
        XO.toast('Still preparing your logo — one moment', 'fa-circle-notch');
        return;
      }
      var design = designer ? designer.design() : null;
      var r = Cart.add(p, matrix.qty(), { logo: !!design });
      if (!r.ok) { XO.toast('Enter a quantity first', 'fa-triangle-exclamation'); return; }

      if (design) {
        Designs.set(p.uid + '|logo', design);
        XO.toast(r.added + ' pieces added, with your artwork');
      } else {
        XO.toast(r.added + ' pieces added to your cart');
      }
      matrix.reset();
    });

    XO.el('#waBtn').addEventListener('click', function () {
      var q = matrix.qty(), units = matrix.units();
      var lines = ['Hello XpertOne, I would like to order:', '', p.title];
      if (units > 0) {
        lines.push('Sizes: ' + Object.keys(q).filter(function (s) { return q[s] > 0; })
          .map(function (s) { return s + ' x' + q[s]; }).join(', '));
        lines.push('Total: ' + units + ' pieces');
        lines.push('Estimated value: ' + XO.money(Pricing.lineTotal(p.price, units)) + ' (ex VAT)');
      } else {
        lines.push('Please send me pricing and available sizes.');
      }
      var d = designer ? designer.design() : null;
      if (d) lines.push('Artwork: ' + Designs.describe(d));
      window.open(XO.waLink(lines.join('\n')), '_blank', 'noopener');
    });
  }

  function related(p) {
    Catalog.byCategory(p.category).then(function (list) {
      var others = list.filter(function (x) { return x.uid !== p.uid; }).slice(0, 4);
      if (!others.length) return;
      XO.el('#relatedWrap').hidden = false;
      ProductGrid('#related', others);
    });
  }

});
</script>
</body>
</html>
