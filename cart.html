<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Order — XpertOne Prints</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-page="cart">
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main" class="container py-5">

  <div class="steps">
    <span class="step is-active"><span class="step__n">1</span> Your order</span>
    <span class="step__sep"></span>
    <span class="step"><span class="step__n">2</span> Details &amp; delivery</span>
    <span class="step__sep"></span>
    <span class="step"><span class="step__n">3</span> Confirm</span>
  </div>

  <h1 class="mb-4">Your order</h1>

  <div id="cartBody"></div>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/designer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  function empty() {
    return '<div class="empty-state">' +
      '<div class="empty-state__icon"><i class="fa-solid fa-cart-shopping"></i></div>' +
      '<h2>Your order is empty</h2>' +
      '<p class="text-muted-xo">Add products from the catalogue and your size split will show up here.</p>' +
      '<div class="d-flex gap-2 justify-content-center flex-wrap">' +
        '<a class="btn btn-xo" href="shop.html">Browse the catalogue</a>' +
        '<a class="btn btn-wa" href="' + XO.waLink('Hello XpertOne, I would like to place an order.') +
        '" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Order on WhatsApp</a>' +
      '</div></div>';
  }

  function lineHtml(l) {
    var q = Cart.lineQty(l);
    var unit = Pricing.unitPrice(l.price, q);
    var sizes = Object.keys(l.qty)
      .sort(function (a, b) { return XO_CONFIG.SIZE_ORDER.indexOf(a) - XO_CONFIG.SIZE_ORDER.indexOf(b); });

    return '<div class="cart-line" data-key="' + XO.esc(l.key) + '">' +
      '<div class="cart-line__media">' +
        (l.image ? '<img src="' + XO.esc(l.image) + '" alt="">' : '<i class="fa-solid fa-image text-muted-xo"></i>') +
      '</div>' +
      '<div>' +
        '<a class="cart-line__title" href="product.html?p=' + encodeURIComponent(l.uid) + '">' + XO.esc(l.title) + '</a>' +
        '<div class="text-muted-xo" style="font-size:.86rem">' + XO.esc(l.categoryName) +
          ' · ' + XO.money(unit) + ' per piece' +
          (unit < l.price ? ' <span style="color:var(--xo-success);font-weight:600">(volume price)</span>' : '') +
          (l.logo ? ' · <span style="color:var(--xo-ink);font-weight:600">logo printing</span>' : '') +
        '</div>' +
        '<div class="cart-line__sizes">' +
          sizes.map(function (s) {
            return '<span class="size-chip">' + XO.esc(s) +
              ' <input type="number" min="0" step="1" value="' + l.qty[s] + '" data-size="' + XO.esc(s) + '" ' +
              'aria-label="Quantity of size ' + XO.esc(s) + '" ' +
              'style="width:56px;border:1px solid var(--xo-line-strong);border-radius:5px;padding:1px 5px;' +
              'font-weight:700;text-align:center;font-variant-numeric:tabular-nums"></span>';
          }).join('') +
        '</div>' +
        '<button class="btn btn-link p-0 mt-2" data-remove type="button" ' +
          'style="font-size:.85rem;color:var(--xo-danger);text-decoration:none">' +
          '<i class="fa-solid fa-trash-can"></i> Remove</button>' +
      '</div>' +
      '<div class="cart-line__amount num">' + XO.money(Pricing.lineTotal(l.price, q)) +
        '<div class="text-muted-xo" style="font-size:.8rem;font-weight:500">' + q + ' pcs</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    var lines = Cart.lines();
    var body = XO.el('#cartBody');

    if (!lines.length) { body.innerHTML = empty(); return; }

    var t = Cart.totals();
    var moqWarn = lines.filter(function (l) { return Cart.lineQty(l) < XO_CONFIG.MOQ; });

    body.innerHTML =
      '<div class="row g-4 g-lg-5">' +
        '<div class="col-lg-8">' +
          (moqWarn.length
            ? '<div class="alert d-flex gap-3" style="background:var(--xo-danger-bg);border:1px solid #F5C2C2;color:#8B2C2C">' +
              '<i class="fa-solid fa-triangle-exclamation mt-1"></i><div>' +
              '<b>Minimum order is ' + XO_CONFIG.MOQ + ' pieces per product.</b><br>' +
              '<span style="font-size:.9rem">Increase the quantity on: ' +
              moqWarn.map(function (l) { return XO.esc(l.title); }).join(', ') + '</span></div></div>'
            : '') +
          lines.map(lineHtml).join('') +
          '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4">' +
            '<a class="btn btn-outline-xo" href="shop.html"><i class="fa-solid fa-arrow-left"></i> Continue shopping</a>' +
            '<button class="btn btn-link p-0" id="clearBtn" type="button" ' +
              'style="color:var(--xo-muted);text-decoration:none;font-size:.88rem">Clear order</button>' +
          '</div>' +
        '</div>' +

        '<div class="col-lg-4">' +
          '<div class="summary-card">' +
            '<h2 class="h5 mb-3">Order summary</h2>' +
            '<div class="summary-card__row"><span>' + t.units + ' pieces · ' + t.lines + ' product' +
              (t.lines === 1 ? '' : 's') + '</span><b class="num">' + XO.money(t.subtotal) + '</b></div>' +
            (t.savings > 0
              ? '<div class="summary-card__row"><span style="color:var(--xo-success)">Volume discount</span>' +
                '<b class="num" style="color:var(--xo-success)">-' + XO.money(t.savings) + '</b></div>' : '') +
            '<div class="summary-card__row"><span>Delivery</span><b class="num">' +
              (t.delivery ? XO.money(t.delivery) : 'Free') + '</b></div>' +
            '<div class="summary-card__row"><span>VAT (5%)</span><b class="num">' + XO.money(t.vat) + '</b></div>' +
            '<div class="summary-card__row summary-card__total"><span>Total</span>' +
              '<b class="num">' + XO.money(t.total) + '</b></div>' +

            (t.delivery
              ? '<p class="form-text mt-2">Add ' + XO.money(XO_CONFIG.FREE_DELIVERY_THRESHOLD - t.subtotal) +
                ' more for free delivery in Dubai.</p>' : '') +

            (lines.some(function (l) { return XO.indicative(l); })
              ? '<p class="price-note mt-3 mb-0"><i class="fa-solid fa-circle-info"></i> ' +
                'This total is indicative. We price your order properly and send you a ' +
                'written quotation to approve before anything is printed or shipped.</p>' : '') +

            '<a class="btn btn-xo btn-lg-xo w-100 mt-3" href="checkout.html" id="coBtn">' +
              'Checkout as guest <i class="fa-solid fa-arrow-right"></i></a>' +
            '<button class="btn btn-wa w-100 mt-2" id="waOrder" type="button">' +
              '<i class="fa-brands fa-whatsapp"></i> Send this order on WhatsApp</button>' +
            '<p class="form-text text-center mt-3 mb-0">No account needed. We reply within business hours.</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    XO.els('.cart-line').forEach(function (row) {
      var key = row.getAttribute('data-key');
      XO.els('input[data-size]', row).forEach(function (inp) {
        inp.addEventListener('change', function () {
          Cart.setQty(key, inp.getAttribute('data-size'), inp.value);
          render();
        });
      });
      XO.el('[data-remove]', row).addEventListener('click', function () {
        Cart.remove(key); XO.toast('Product removed', 'fa-trash-can'); render();
      });
    });

    XO.el('#clearBtn').addEventListener('click', function () {
      Cart.clear(); XO.toast('Order cleared', 'fa-trash-can'); render();
    });

    XO.el('#waOrder').addEventListener('click', function () {
      window.open(XO.waLink(Cart.asMessage()), '_blank', 'noopener');
    });

    if (moqWarn.length) {
      var b = XO.el('#coBtn');
      b.classList.add('disabled');
      b.setAttribute('aria-disabled', 'true');
      b.addEventListener('click', function (e) {
        e.preventDefault();
        XO.toast('Minimum order is ' + XO_CONFIG.MOQ + ' pieces per product', 'fa-triangle-exclamation');
      });
    }
  }

  render();
});
</script>
</body>
</html>
