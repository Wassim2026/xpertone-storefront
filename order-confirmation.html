<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Order Received — XpertOne Prints</title>
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-page="cart">
<div id="siteHeader"></div>

<main id="main" class="container py-5">
  <div class="steps">
    <span class="step is-done"><span class="step__n"><i class="fa-solid fa-check"></i></span> Your order</span>
    <span class="step__sep"></span>
    <span class="step is-done"><span class="step__n"><i class="fa-solid fa-check"></i></span> Details &amp; delivery</span>
    <span class="step__sep"></span>
    <span class="step is-active"><span class="step__n">3</span> Confirm</span>
  </div>

  <div id="confirmBody"></div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  var data = null;
  try { data = JSON.parse(sessionStorage.getItem('xo_last_order') || 'null'); } catch (e) {}

  var body = XO.el('#confirmBody');

  if (!data) {
    body.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state__icon"><i class="fa-solid fa-receipt"></i></div>' +
      '<h2>No recent order on this device</h2>' +
      '<p class="text-muted-xo">If you have just placed one, our team already has it. ' +
      'Otherwise start a new order below.</p>' +
      '<a class="btn btn-xo" href="shop.html">Browse the catalogue</a></div>';
    return;
  }

  var c = data.customer || {};
  var tot = (data.payload && data.payload.totals) || {};
  var items = (data.payload && data.payload.items) || [];

  body.innerHTML =
    '<div class="row justify-content-center"><div class="col-lg-9">' +
      '<div class="text-center mb-4">' +
        '<div class="empty-state__icon" style="background:var(--xo-success-bg);color:var(--xo-success)">' +
          '<i class="fa-solid fa-check"></i></div>' +
        '<h1>Order received</h1>' +
        '<p class="lead mb-0">Thank you' + (c.name ? ', ' + XO.esc(c.name.split(' ')[0]) : '') +
        '. Our sales team will confirm stock, printing and the final invoice' +
        (c.phone ? ' on ' + XO.esc(c.phone) : '') + ' within business hours.</p>' +
        (data.reference ? '<p class="mt-2 mb-0"><span class="badge-xo badge-xo--ink">Reference ' +
          XO.esc(data.reference) + '</span></p>' : '') +
      '</div>' +

      '<div class="border rounded-3 p-4 mb-4">' +
        '<h2 class="h5 mb-3">What you ordered</h2>' +
        items.map(function (i) {
          return '<div class="d-flex justify-content-between gap-3 py-2" style="border-bottom:1px solid var(--xo-line)">' +
            '<div style="font-size:.92rem"><b style="color:var(--xo-ink)">' + XO.esc(i.title) + '</b>' +
            '<div class="text-muted-xo">' + i.quantity_total + ' pcs · ' +
            Object.keys(i.quantities || {}).map(function (s) { return s + ' x' + i.quantities[s]; }).join(', ') +
            (i.logo_printing ? ' · logo printing' : '') + '</div></div>' +
            '<div class="num" style="font-weight:700;color:var(--xo-ink);white-space:nowrap">' +
            XO.money(i.line_total) + '</div></div>';
        }).join('') +
        '<div class="d-flex justify-content-between mt-3 pt-3" style="border-top:1px solid var(--xo-line)">' +
          '<b style="color:var(--xo-ink);font-size:1.05rem">Total incl. VAT</b>' +
          '<b class="num" style="font-size:1.35rem;color:var(--xo-ink)">' + XO.money(tot.grand_total || 0) + '</b></div>' +
      '</div>' +

      '<div class="row g-3">' +
        '<div class="col-md-6"><div class="border rounded-3 p-4 h-100">' +
          '<h3 class="h6">Delivering to</h3>' +
          '<p class="mb-0" style="font-size:.92rem">' +
            (c.company ? '<b style="color:var(--xo-ink)">' + XO.esc(c.company) + '</b><br>' : '') +
            XO.esc(c.address || '') + (c.area ? '<br>' + XO.esc(c.area) : '') +
            (c.emirate ? '<br>' + XO.esc(c.emirate) : '') + '</p></div></div>' +
        '<div class="col-md-6"><div class="border rounded-3 p-4 h-100">' +
          '<h3 class="h6">Payment</h3>' +
          '<p class="mb-0" style="font-size:.92rem">' + XO.esc(c.payment || '—') +
          (c.trn ? '<br>TRN: ' + XO.esc(c.trn) : '') + '</p></div></div>' +
      '</div>' +

      '<div class="d-flex gap-2 justify-content-center flex-wrap mt-4">' +
        '<button class="btn btn-outline-xo" onclick="window.print()"><i class="fa-solid fa-print"></i> Print this page</button>' +
        '<a class="btn btn-wa" id="waFollow" href="#" target="_blank" rel="noopener">' +
          '<i class="fa-brands fa-whatsapp"></i> Message us about this order</a>' +
        '<a class="btn btn-xo" href="shop.html">Order something else</a>' +
      '</div>' +
    '</div></div>';

  XO.el('#waFollow').href = XO.waLink(data.message || 'Hello XpertOne, about my recent order:');
});
</script>
</body>
</html>
